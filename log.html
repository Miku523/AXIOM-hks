<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>操作记录</title>
<style>
  body{margin:0;background:#0f1115;color:#e6e6e6;font:13px system-ui;padding:16px}
  h1{font-size:16px;margin:0 0 12px;display:flex;gap:12px;align-items:center}
  button{padding:4px 10px;background:#2a2f3a;color:#e6e6e6;border:0;border-radius:4px;cursor:pointer}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #2a2f3a;white-space:nowrap}
  th{color:#8a93a6;font-weight:500}
  .ok{color:#3ec98a}.bad{color:#ffb84f}
  .mute{color:#8a93a6}
  #sum{color:#8a93a6;margin-bottom:10px}
</style>
</head>
<body>
<h1>操作记录 <button id="refresh">刷新</button><button id="clear">清空</button><button id="csv">导出 CSV</button> <a href="./replay.html" style="color:#8a93a6;font-size:12px;font-weight:400">回放 →</a></h1>
<div id="sum"></div>
<table><thead><tr><th>时间</th><th>步骤</th><th>手势</th><th>命中</th><th>置信度</th><th>模式</th><th>结果</th></tr></thead><tbody id="rows"></tbody></table>

<script type="module">
import { readOps, clearOps } from './oplog.js';
const G = { pinch:'捏合', release:'松开', fist:'握拳' };
const T = { bottle:'药瓶', beaker:'烧杯', lamp:'酒精灯', table:'桌面', spoon:'药匙' };
function render(){
  const ops = readOps().slice().reverse();
  const ok = ops.filter(o => o.ok).length;
  document.getElementById('sum').textContent = ops.length ? `${ops.length} 条 · 成功 ${ok} · 误操作 ${ops.length-ok} (${(100*(ops.length-ok)/ops.length).toFixed(1)}%)` : '暂无记录';
  document.getElementById('rows').innerHTML = ops.map(o => `<tr>
    <td class="mute">${new Date(o.t).toLocaleTimeString()}</td>
    <td>${o.step}. ${o.title}</td>
    <td>${G[o.gesture] ?? o.gesture}</td>
    <td>${o.target ? (T[o.target] ?? o.target) : '<span class="mute">—</span>'}</td>
    <td>${o.conf == null ? '<span class="mute">—</span>' : (o.conf*100).toFixed(0)+'%'}</td>
    <td class="mute">${o.mode === 'hand' ? '手势' : '鼠标'}</td>
    <td class="${o.ok?'ok':'bad'}">${o.ok ? '✓' : '✗ ' + o.msg}</td></tr>`).join('');
}
document.getElementById('refresh').onclick = render;
document.getElementById('clear').onclick = () => { clearOps(); render(); };
document.getElementById('csv').onclick = () => {
  const ops = readOps();
  const csv = ['time,step,title,gesture,target,conf,mode,ok,msg', ...ops.map(o => [new Date(o.t).toISOString(), o.step, o.title, o.gesture, o.target ?? '', o.conf ?? '', o.mode, o.ok, JSON.stringify(o.msg)].join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'oplog.csv'; a.click();
};
render();
</script>
</body>
</html>
