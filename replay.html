<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>操作回放</title>
<style>
  body{margin:0;background:#0f1115;color:#e6e6e6;font:13px system-ui;padding:16px}
  h1{font-size:16px;margin:0 0 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1 a{color:#8a93a6;font-weight:400;font-size:12px}
  button,select{padding:4px 10px;background:#2a2f3a;color:#e6e6e6;border:0;border-radius:4px;cursor:pointer}
  #wrap{display:grid;grid-template-columns:1fr 320px;gap:14px}
  canvas{width:100%;background:#151922;border-radius:8px;display:block}
  #ctl{display:flex;gap:8px;align-items:center;margin:10px 0}
  #ctl input{flex:1}
  #clock{font-variant-numeric:tabular-nums;color:#8a93a6;min-width:90px}
  #list{max-height:520px;overflow:auto;border:1px solid #2a2f3a;border-radius:8px}
  .op{padding:6px 10px;border-bottom:1px solid #1e2330;cursor:pointer;display:flex;gap:8px}
  .op.cur{background:#1f2a3f}.op.past{opacity:.55}
  .op .t{color:#8a93a6;font-variant-numeric:tabular-nums;min-width:48px}
  .ok{color:#3ec98a}.bad{color:#ffb84f}
  #bar{height:6px;background:#1e2330;border-radius:3px;margin-bottom:6px;overflow:hidden}
  #bar i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#3ec98a);transition:width .3s}
  #msg{min-height:20px;color:#ffb84f}
</style>
</head>
<body>
<h1>操作回放
  <select id="run"></select>
  <button id="play">▶ 播放</button>
  <label><input type="checkbox" id="fast" checked> 压缩等待(最长 1.5s)</label>
  <a href="./index.html">← 返回实验</a> <a href="./log.html">记录</a> <a id="cert" href="#">证书</a>
</h1>
<div id="wrap">
  <div>
    <div id="bar"><i id="prog"></i></div>
    <canvas id="c" width="800" height="440"></canvas>
    <div id="ctl"><span id="clock">0.0s</span><input type="range" id="seek" min="0" max="0" value="0" step="1"></div>
    <div id="msg"></div>
  </div>
  <div id="list"></div>
</div>

<script type="module">
import { readOps } from './oplog.js';
import { FLOW, score } from './fsm.js';
const G = { pinch:'捏合', release:'松开', fist:'握拳', short:'保持不足' };
const T = { bottle:'药瓶', beaker:'烧杯', lamp:'酒精灯', table:'桌面', spoon:'药匙' };
// 2D 俯视台面：物体位置与 3D 场景一致的相对关系
const POS = { bottle:[170,250], spoon:[330,300], beaker:[470,240], lamp:[640,250], table:[400,340] };

const all = readOps();
const runs = [...new Set(all.map(o => o.run).filter(Boolean))].sort((a,b)=>b-a);
const sel = document.getElementById('run');
const q = new URLSearchParams(location.search).get('run');
sel.innerHTML = runs.map(r => `<option value="${r}">${new Date(r).toLocaleString()}</option>`).join('') || '<option>暂无记录</option>';
if (q && runs.includes(+q)) sel.value = q;

let ops = [], i = -1, timer = null, elapsed = 0;
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const list = document.getElementById('list'), seek = document.getElementById('seek');

function load(){
  stop(); ops = all.filter(o => o.run === +sel.value); i = -1;
  document.getElementById('cert').href = `./cert.html?run=${sel.value}`;
  seek.max = Math.max(0, ops.length - 1); seek.value = 0;
  list.innerHTML = ops.map((o,k) => `<div class="op" data-k="${k}"><span class="t">+${((o.t-ops[0].t)/1000).toFixed(1)}s</span>
    <span>${o.step}.${FLOW[o.step-1]?.title ?? ''}</span><span>${G[o.gesture]??o.gesture}${o.target?'→'+(T[o.target]??o.target):''}</span>
    <span class="${o.ok?'ok':'bad'}">${o.ok?'✓':'✗ '+(o.msg||o.code)}</span></div>`).join('') || '<div class="op">该轮无记录</div>';
  draw();
}
function draw(){
  const o = ops[i], cur = o ? o.step - 1 : 0;
  const done = o ? (o.ok ? o.step : o.step - 1) : 0;
  document.getElementById('prog').style.width = `${done / FLOW.length * 100}%`;
  cx.clearRect(0,0,cv.width,cv.height);
  // 台面
  cx.fillStyle = '#5a3d22'; cx.beginPath(); cx.ellipse(400,290,320,90,0,0,7); cx.fill();
  // 物体
  for (const [n,[x,y]] of Object.entries(POS)) {
    if (n === 'table') continue;
    const hit = o && o.target === n, want = FLOW[cur]?.target === n;
    cx.beginPath(); cx.arc(x,y,34,0,7);
    cx.fillStyle = hit ? (o.ok ? '#3ec98a' : '#ffb84f') : '#2a2f3a'; cx.fill();
    if (want) { cx.lineWidth = 3; cx.strokeStyle = '#4f8cff'; cx.setLineDash([6,4]); cx.stroke(); cx.setLineDash([]); }
    cx.fillStyle = '#e6e6e6'; cx.font = '14px system-ui'; cx.textAlign = 'center'; cx.fillText(T[n], x, y+54);
  }
  // 手势图标
  cx.font = '36px system-ui'; cx.textAlign = 'left';
  cx.fillText(o ? ({pinch:'🤏',release:'🖐️',fist:'✊',short:'⏱️'}[o.gesture] ?? '✋') : '👋', 24, 60);
  cx.font = '16px system-ui'; cx.fillStyle = '#e6e6e6';
  cx.fillText(o ? `第 ${o.step} 步 · ${FLOW[cur]?.title ?? ''}  —  ${G[o.gesture]??o.gesture}${o.target?' → '+(T[o.target]??o.target):''}` : '点击播放开始回放', 80, 52);
  cx.fillStyle = '#8a93a6'; cx.font = '13px system-ui';
  cx.fillText(o ? `目标：${FLOW[cur]?.hint ?? ''}` : `共 ${ops.length} 条操作`, 80, 74);
  document.getElementById('msg').textContent = o && !o.ok ? `✗ ${o.msg || o.code}` : (o && i === ops.length-1 ? `✓ 完成 · 得分 ${score(ops).score}（${score(ops).grade}）` : '');
  document.getElementById('clock').textContent = `${elapsed.toFixed(1)}s`;
  seek.value = Math.max(0,i);
  [...list.children].forEach((el,k) => { el.className = 'op' + (k===i?' cur':k<i?' past':''); });
  list.children[i]?.scrollIntoView({block:'nearest'});
}
function step(){
  if (i >= ops.length - 1) return stop();
  i++; elapsed = (ops[i].t - ops[0].t) / 1000; draw();
  if (i < ops.length - 1) {
    let wait = ops[i+1].t - ops[i].t;
    if (document.getElementById('fast').checked) wait = Math.min(wait, 1500);
    timer = setTimeout(step, Math.max(250, wait));
  } else stop();
}
function stop(){ clearTimeout(timer); timer = null; document.getElementById('play').textContent = '▶ 播放'; }
document.getElementById('play').onclick = () => {
  if (timer) return stop();
  if (i >= ops.length - 1) { i = -1; elapsed = 0; }
  document.getElementById('play').textContent = '⏸ 暂停'; step();
};
seek.oninput = () => { stop(); i = +seek.value; elapsed = ops[i] ? (ops[i].t-ops[0].t)/1000 : 0; draw(); };
list.onclick = e => { const k = e.target.closest('.op')?.dataset.k; if (k != null) { stop(); i = +k; elapsed = (ops[i].t-ops[0].t)/1000; draw(); } };
sel.onchange = load;
load();
</script>
</body>
</html>
