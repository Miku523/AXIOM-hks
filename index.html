<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>物理沙盒平台 · 化学实验</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--fg:#e6e6e6;--mute:#8a93a6;--acc:#4f8cff;--ok:#3ec98a;--warn:#ffb84f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
  #app{display:grid;height:100%;grid-template-columns:1fr 300px;grid-template-rows:1fr 72px;grid-template-areas:"view side" "steps steps"}
  #view{grid-area:view;position:relative;overflow:hidden;cursor:crosshair}
  #view canvas{display:block}
  #side{grid-area:side;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
  #cam{height:220px;border-bottom:1px solid var(--line);position:relative;background:#000}
  #cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #cam .label{position:absolute;top:6px;left:8px;font-size:12px;color:var(--mute);background:#0008;padding:2px 6px;border-radius:3px}
  #cam button{position:absolute;bottom:8px;right:8px;background:var(--acc);color:#fff;border:0;padding:4px 10px;border-radius:4px;cursor:pointer}
  #cam button:disabled{opacity:.6}
  #props{flex:1;padding:12px}
  #props h3{font-size:13px;color:var(--mute);margin-bottom:8px}
  #props .empty{color:var(--mute);border:1px dashed var(--line);padding:24px;text-align:center;border-radius:6px}
  #steps{grid-area:steps;display:flex;align-items:center;gap:8px;padding:0 16px;border-top:1px solid var(--line);background:var(--panel)}
  .step{flex:1;padding:8px 12px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
  .step.active{border-color:var(--acc);color:var(--fg);background:#1d2533}
  .step.done{border-color:var(--ok);color:var(--ok);opacity:.7}
  .step small{display:block;font-size:11px;opacity:.7}
  #hud{position:absolute;top:8px;left:8px;font-size:12px;color:var(--mute);background:#0008;padding:4px 8px;border-radius:4px;pointer-events:none}
  #tip{position:absolute;left:50%;top:16px;transform:translateX(-50%) translateY(-8px);opacity:0;transition:.2s;
       background:#2a2412;border:1px solid var(--warn);color:var(--warn);padding:8px 14px;border-radius:6px;pointer-events:none}
  #tip.show{opacity:1;transform:translateX(-50%)}
  #hintbar{position:absolute;left:0;right:0;bottom:0;height:36px;background:#171a21cc;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:12px;font-size:13px}
  #progress{position:absolute;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--acc),#7fb0ff,var(--acc));background-size:200% 100%;animation:flow 2s linear infinite;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 8px var(--acc)}
  #progress.done{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  @keyframes flow{to{background-position:-200% 0}}
  #hintbar.bump{animation:bump .5s}
  @keyframes bump{30%{background:#1d3a2a}}
  .step{transition:.3s}
  .step.active{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 3px #4f8cff33}}
  .step.done{animation:pop .4s}
  @keyframes pop{40%{transform:scale(1.04)}}
  #hint{flex:1;color:var(--fg)}
  #hintbar a{color:var(--mute);font-size:12px;text-decoration:none}
  #hintbar a:hover{color:var(--acc)}
  #intro{position:fixed;inset:0;background:#0f1115e6;display:flex;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(4px)}
  #intro.hide{display:none}
  #intro .card{width:520px;background:#171a21;border:1px solid #2a2f3a;border-radius:12px;padding:28px 32px;box-shadow:0 16px 48px #000a}
  #intro h1{margin:0 0 6px;font-size:26px;color:#4f8cff}
  #intro .lead{font-size:18px;margin:0 0 16px;color:#e6e6e6}
  #intro ol{margin:0 0 12px;padding-left:22px;line-height:1.9;color:#c9d1e0}
  #intro .sub{color:#8a93a6;font-size:13px;margin:0 0 18px}
  #intro button{padding:8px 18px;background:#4f8cff;color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:14px;margin-right:10px}
  #intro button.ghost{background:transparent;border:1px solid #2a2f3a;color:#c9d1e0}
</style>
</head>
<body>
<div id="app">
  <div id="view"><div id="hud"></div><div id="tip"></div>
    <div id="hintbar"><div id="progress"></div><span id="hint"></span><a href="./log.html" target="_blank">操作记录</a><a href="./replay.html" target="_blank">回放</a><a href="./cert.html" target="_blank">证书</a></div>
  </div>
  <aside id="side">
    <div id="cam">
      <video autoplay muted playsinline></video>
      <canvas id="camOverlay" width="300" height="220"></canvas>
      <span class="label">摄像头 · <span id="camInfo">未开启</span></span>
      <button id="camBtn">开启手势模式</button>
    </div>
    <div id="props"><h3>属性</h3><div class="empty">待接入</div></div>
  </aside>
  <div id="steps"></div>
</div>

<div id="intro">
  <div class="card">
    <h1>虚手实验室</h1>
    <p class="lead">打开摄像头，抬起你的手，开始虚拟实验。</p>
    <ol>
      <li>点击「开启手势模式」，把手放进右上角的画面里。</li>
      <li>手掌张开移动，蓝色光标就是你的指尖。</li>
      <li>拇指食指捏合 = 抓取 / 操作，保持半秒才算数。</li>
      <li>握拳 = 盖灭酒精灯。</li>
      <li>底部进度条会告诉你下一步做什么。</li>
      <li>做完 8 步，自动生成你的实验证书。</li>
    </ol>
    <p class="sub">没有摄像头？用鼠标：左键 = 捏合，右键 = 握拳。</p>
    <button id="introCam">开启手势模式</button>
    <button id="introMouse" class="ghost">先用鼠标试试</button>
    <button id="introDemo" class="ghost">自动演示</button>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="./main.js"></script>
</body>
</html>
